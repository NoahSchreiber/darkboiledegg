      padding-bottom: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;

    .lang-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      white-space: nowrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 180px;
      max-width: 340px;
    }

    .search-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 0.85rem;
      padding: 5px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: #555; }
    .search-input::placeholder { color: #555; }

    .count-label {
      font-size: 0.78rem;
      color: #555;
      white-space: nowrap;
    }

    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .results-hint {
      color: #6f6f6f;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .load-more-button {
      border: 1px solid #2e4a2e;
      background: #162016;
      color: #bde0bd;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .load-more-button:hover {
      background: #1c2a1c;
      border-color: #3d613d;
    }

    .load-more-button[hidden] {
      display: none;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .flip-card {
      perspective: 800px;
      height: 90px;
      cursor: pointer;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }

    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
    }

    .flip-front {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      font-size: 0.95rem;
      font-weight: 500;
      color: #e8e8e8;
      transition: border-color 0.15s, background 0.15s;
    }
    .flip-front:hover { border-color: #555; background: #222; }

    .flip-back {
      background: #1c2a1c;
      border: 1px solid #2e4a2e;
      transform: rotateY(180deg);
      font-size: 0.82rem;
      color: #a8d8a8;
      line-height: 1.4;
    }

    .no-results {
      grid-column: 1 / -1;
      color: #555;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    @media (max-width: 640px) {
      .results-toolbar {
        align-items: stretch;
      }

      .load-more-button {
        width: 100%;
      }
    }

    var PAGE_SIZE = 120;
    var grid = document.getElementById('card-grid-fr');
    var searchInput = document.getElementById('search-fr');
    var countLabel = document.getElementById('count-fr');
    var resultsHint = document.getElementById('results-hint-fr');
    var loadMoreButton = document.getElementById('load-more-fr');
    var filteredVocab = vocabFR.slice();
    var visibleCount = 0;
    var searchTimer = null;

    function makeCard(item) {
      var card = document.createElement('div');
      card.className = 'flip-card';

      var inner = document.createElement('div');
      inner.className = 'flip-inner';

      var front = document.createElement('div');
      front.className = 'flip-front';
      front.textContent = item.fr;

      var back = document.createElement('div');
      back.className = 'flip-back';
      back.textContent = item.de;

      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);

      return card;
    }

    function getFilteredVocab(query) {
      var q = query.trim().toLowerCase();

      if (q === '') {
        return vocabFR;
      }

      return vocabFR.filter(function(item) {
        return item.fr.toLowerCase().includes(q) || item.de.toLowerCase().includes(q);
      });
    }

    function renderCards() {
      grid.innerHTML = '';
      countLabel.textContent = visibleCount + ' / ' + filteredVocab.length + ' sichtbar';

      if (filteredVocab.length === 0) {
        var msg = document.createElement('p');
        msg.className = 'no-results';
        msg.textContent = 'Keine Treffer.';
        grid.appendChild(msg);
        resultsHint.textContent = '';
        loadMoreButton.hidden = true;
        return;
      }

      var fragment = document.createDocumentFragment();
      filteredVocab.slice(0, visibleCount).forEach(function(item) {
        fragment.appendChild(makeCard(item));
      });
      grid.appendChild(fragment);

      if (visibleCount < filteredVocab.length) {
        resultsHint.textContent = 'Es werden nur die ersten Treffer geladen, damit die Seite flüssig bleibt.';
      } else {
        resultsHint.textContent = '';
      }

      loadMoreButton.hidden = visibleCount >= filteredVocab.length;
    }

    function applyFilter(query) {
      filteredVocab = getFilteredVocab(query);
      visibleCount = Math.min(PAGE_SIZE, filteredVocab.length);
      renderCards();
    }

    grid.addEventListener('click', function(event) {
      var card = event.target.closest('.flip-card');

      if (card && grid.contains(card)) {
        card.classList.toggle('flipped');
      }
    });

    loadMoreButton.addEventListener('click', function() {
      visibleCount = Math.min(visibleCount + PAGE_SIZE, filteredVocab.length);
      renderCards();
    });

    applyFilter('');
    searchInput.addEventListener('input', function() {
      if (searchTimer) {
        clearTimeout(searchTimer);
      }

      searchTimer = setTimeout(function() {
        applyFilter(searchInput.value);
      }, 80);
    });
  </script>
